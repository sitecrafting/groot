name: Pull Request

on:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHPUnit
        runs-on: ubuntu-latest

        services:
            testdb:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: test
                    MYSQL_USER: test
                    MYSQL_PASSWORD: test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mysqli
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            # Leaving in case this is useful for integration testing
            # - name: Install WordPress test suite
            #   env:
            #       DB_HOST: 127.0.0.1
            #       DB_NAME: test
            #       DB_USER: test
            #       DB_PASS: test
            #   run: bash scripts/install-wp-tests.sh

            - name: Run unit tests
              run: ./vendor/bin/phpunit --configuration phpunit.xml.dist

            - name: Run unit tests - Multisite
              run: ./vendor/bin/phpunit --configuration phpunit-multisite.xml.dist

            # Leaving for integration tests
            # - name: Run integration tests
            #   run: ./vendor/bin/phpunit --configuration phpunit-integration.xml.dist

            # - name: Run integration tests - Multisite
            #   run: ./vendor/bin/phpunit --configuration phpunit-integration-multisite.xml.dist
